name: Fix monolingual post content

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "WordPress post ID to strip Arabic-script mashup from EN content"
        required: true
        type: string

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: python -m pip install requests
      - name: Strip EN mashup
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          FIX_POST_ID: ${{ inputs.post_id }}
        run: python fix_post_monolingual.py
